<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { font-family: Inter, system-ui, sans-serif; }
  body { margin: 0; padding: 12px; font-size: 12px; color: #1e1e1e; }
  h2 { font-size: 13px; margin: 0 0 8px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  button {
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #d0d0d0;
    background: #f5f5f5;
    cursor: pointer;
  }
  button.primary { background: #18a0fb; color: white; border-color: #18a0fb; }
  button:hover { opacity: 0.9; }
  .empty { color: #888; padding: 8px 0; }

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid #e0e0e0;
    margin-bottom: 12px;
  }
  .tab-btn {
    border: none;
    border-radius: 0;
    background: transparent;
    padding: 8px 10px;
    color: #666;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active {
    color: #18a0fb;
    border-bottom-color: #18a0fb;
    font-weight: 600;
  }
  .tab-view.hidden { display: none; }

  .relation {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 4px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    border-radius: 4px;
  }
  .relation:hover { background: #f7fbff; }
  .relation.selected { background: #eef6ff; }
  .relation .name { font-weight: 600; }
  .relation .label { color: #888; font-style: italic; flex: 1; text-align: center; }

  .boxes { margin-bottom: 12px; }
  .box-item {
    padding: 4px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .box-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .box-detail {
    margin: 4px 0 0 28px;
    color: #666;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .box-detail .tech-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .box-detail .tech-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #999;
  }
  .box-detail .tech {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: #eef6ff;
    color: #1a6fb0;
  }
  .box-detail .desc {
    font-style: italic;
    color: #555;
    line-height: 1.4;
  }
  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    background: #eee;
    color: #666;
  }
  .badge.fallback { background: #fde3e3; color: #b23c3c; }
  .type-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 8px;
    border-radius: 10px;
  }
  h3 { font-size: 12px; margin: 12px 0 4px; color: #666; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border-radius: 4px;
    border: 1px solid transparent;
    background: transparent;
    color: #555;
    cursor: pointer;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: #eef6ff; border-color: #18a0fb; color: #18a0fb; }
  .icon-btn svg { width: 14px; height: 14px; }
  .box-row .name { flex: 1; }

  .relation-detail {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d8e8fa;
    background: #f7fbff;
  }
  .relation-detail.hidden { display: none; }
  .relation-detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .relation-detail-header .label-text {
    font-style: italic;
    color: #555;
  }
  .relation-detail-close {
    border: none;
    background: transparent;
    color: #888;
    cursor: pointer;
    font-size: 13px;
    padding: 0 4px;
  }
  .relation-detail-close:hover { color: #b23c3c; }
  .endpoint-card {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 0;
  }
  .endpoint-card + .endpoint-card {
    border-top: 1px dashed #d8e8fa;
  }
  .endpoint-role {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #1a6fb0;
    font-weight: 700;
    width: 42px;
    flex-shrink: 0;
    padding-top: 3px;
  }
  .endpoint-body { flex: 1; min-width: 0; }
  .endpoint-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .endpoint-name-row .name { font-weight: 600; }

  textarea {
    width: 100%;
    height: 320px;
    box-sizing: border-box;
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #d0d0d0;
    resize: vertical;
  }
  .status { color: #888; margin-top: 8px; }
  .hidden { display: none; }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }
  .search-bar input {
    flex: 1;
    box-sizing: border-box;
    padding: 6px 8px;
    font-size: 11px;
    border-radius: 6px;
    border: 1px solid #d0d0d0;
  }
  .search-bar input:focus { outline: none; border-color: #18a0fb; }
  .search-clear {
    display: none;
    border: none;
    background: transparent;
    color: #888;
    cursor: pointer;
    font-size: 14px;
    padding: 0 6px;
  }
  .search-clear:hover { color: #b23c3c; }
</style>
</head>
<body>
  <h2>C4 Relations</h2>
  <div class="toolbar">
    <button id="refresh">Refresh</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="relations">Relaciones</button>
    <button class="tab-btn" data-tab="boxes">Boxes</button>
    <button class="tab-btn" data-tab="export">Export</button>
  </div>

  <div class="search-bar" id="search-bar">
    <input type="text" id="search-input" placeholder="Buscar por nombre, descripción o tecnología..." />
    <button class="search-clear" id="search-clear" title="Limpiar búsqueda">&times;</button>
  </div>

  <div id="relations-view" class="tab-view">
    <h3>Relations (<span id="relation-count">0</span>)</h3>
    <div id="relations"></div>
    <div id="relation-detail" class="relation-detail hidden"></div>
  </div>

  <div id="boxes-view" class="tab-view hidden">
    <h3>Boxes (<span id="box-count">0</span>)</h3>
    <div class="boxes" id="boxes"></div>
  </div>

  <div id="export-view" class="tab-view hidden">
    <div class="toolbar">
      <button id="copy" class="primary">Copy to clipboard</button>
    </div>
    <textarea id="mermaid-output" readonly></textarea>
    <div id="copy-status" class="status"></div>
  </div>

  <script>
    let currentBoxes = [];
    let currentRelations = [];
    let selectedRelationId = null;
    let searchQuery = '';

    const relationsEl = document.getElementById('relations');
    const boxesEl = document.getElementById('boxes');
    const boxCountEl = document.getElementById('box-count');
    const relationCountEl = document.getElementById('relation-count');
    const relationDetailEl = document.getElementById('relation-detail');
    const mermaidOutput = document.getElementById('mermaid-output');
    const copyBtn = document.getElementById('copy');
    const copyStatus = document.getElementById('copy-status');
    const searchBarEl = document.getElementById('search-bar');
    const searchInputEl = document.getElementById('search-input');
    const searchClearEl = document.getElementById('search-clear');

    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabViews = {
      relations: document.getElementById('relations-view'),
      boxes: document.getElementById('boxes-view'),
      export: document.getElementById('export-view'),
    };

    function showTab(name) {
      tabButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.tab === name));
      Object.entries(tabViews).forEach(([key, el]) => el.classList.toggle('hidden', key !== name));
      searchBarEl.classList.toggle('hidden', name === 'export');
      if (name === 'export') {
        mermaidOutput.value = toMermaidC4(currentBoxes, currentRelations);
        copyStatus.textContent = '';
      }
    }

    tabButtons.forEach((btn) => {
      btn.onclick = () => showTab(btn.dataset.tab);
    });

    var DIACRITIC_RE = new RegExp('[̀-ͯ]', 'g');
    function normalizeSearch(str) {
      return String(str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(DIACRITIC_RE, '');
    }

    function matchesSearch(fields) {
      const query = normalizeSearch(searchQuery).trim();
      if (!query) return true;
      const haystack = normalizeSearch(fields.filter(Boolean).join(' '));
      return query.split(/\s+/).every((term) => haystack.includes(term));
    }

    function boxMatchesSearch(b) {
      return matchesSearch([b.name, b.description, b.technology, b.elementType]);
    }

    function relationMatchesSearch(r) {
      const sourceBox = findBox(r.source);
      const targetBox = findBox(r.target);
      return matchesSearch([
        r.sourceName,
        r.targetName,
        r.label,
        sourceBox && sourceBox.description,
        sourceBox && sourceBox.technology,
        sourceBox && sourceBox.elementType,
        targetBox && targetBox.description,
        targetBox && targetBox.technology,
        targetBox && targetBox.elementType,
      ]);
    }

    searchInputEl.addEventListener('input', () => {
      searchQuery = searchInputEl.value;
      searchClearEl.style.display = searchQuery ? 'inline-flex' : 'none';
      renderBoxes();
      renderRelations();
    });

    searchClearEl.onclick = () => {
      searchInputEl.value = '';
      searchQuery = '';
      searchClearEl.style.display = 'none';
      renderBoxes();
      renderRelations();
      searchInputEl.focus();
    };

    document.getElementById('refresh').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'extract' } }, '*');
    };

    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(mermaidOutput.value);
        copyStatus.textContent = 'Copied to clipboard.';
      } catch (e) {
        mermaidOutput.select();
        document.execCommand('copy');
        copyStatus.textContent = 'Copied to clipboard.';
      }
    };

    function renderBoxes() {
      const filtered = currentBoxes.filter(boxMatchesSearch);
      boxCountEl.textContent =
        filtered.length === currentBoxes.length ? currentBoxes.length : filtered.length + ' / ' + currentBoxes.length;
      boxesEl.innerHTML = '';
      if (currentBoxes.length === 0) {
        boxesEl.innerHTML = '<div class="empty">No boxes resolved yet.</div>';
        return;
      }
      if (filtered.length === 0) {
        boxesEl.innerHTML = '<div class="empty">Ningún box coincide con la búsqueda.</div>';
        return;
      }
      filtered.forEach((b) => {
        const item = document.createElement('div');
        item.className = 'box-item';

        const row = document.createElement('div');
        row.className = 'box-row';
        const isFallback = b.labelSource === 'node-name-fallback';
        row.innerHTML =
          '<button class="icon-btn" data-id="' + escapeHtml(b.id) + '" title="Ir al elemento en el lienzo">' +
            LOCATE_ICON_SVG +
          '</button>' +
          '<span class="name">' + escapeHtml(b.name) + '</span>' +
          typeBadgeHtml(b.elementType) +
          '<span class="badge">' + escapeHtml(b.nodeType) + '</span>' +
          '<span class="badge' + (isFallback ? ' fallback' : '') + '">' + escapeHtml(b.labelSource) + '</span>';
        item.appendChild(row);

        if (b.technology || b.description) {
          item.appendChild(renderBoxDetail(b.technology, b.description));
        }

        boxesEl.appendChild(item);
      });
    }

    const KNOWN_TYPE_COLORS = {
      'person': { bg: '#f3e8ff', fg: '#7c3aed' },
      'software system': { bg: '#e6f7ee', fg: '#1f9254' },
      'external system': { bg: '#f2eee0', fg: '#8a6d1f' },
      'container': { bg: '#e8f0fe', fg: '#1a56b0' },
      'component': { bg: '#ffe8ef', fg: '#c23163' },
      'database': { bg: '#e3f6f6', fg: '#0d7a7a' },
    };
    const FALLBACK_TYPE_COLORS = [
      { bg: '#fff4e0', fg: '#b56a00' },
      { bg: '#e8f0fe', fg: '#1a56b0' },
      { bg: '#f3e8ff', fg: '#7c3aed' },
      { bg: '#e6f7ee', fg: '#1f9254' },
      { bg: '#ffe8ef', fg: '#c23163' },
      { bg: '#e3f6f6', fg: '#0d7a7a' },
    ];

    function hashStr(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    function typeBadgeHtml(elementType) {
      if (!elementType) return '';
      const key = elementType.trim().toLowerCase();
      const color = KNOWN_TYPE_COLORS[key] || FALLBACK_TYPE_COLORS[hashStr(key) % FALLBACK_TYPE_COLORS.length];
      return '<span class="type-badge" style="background: ' + color.bg + '; color: ' + color.fg + ';">' +
        escapeHtml(elementType) +
        '</span>';
    }

    function renderBoxDetail(technology, description) {
      const detail = document.createElement('div');
      detail.className = 'box-detail';
      detail.innerHTML =
        (technology
          ? '<div class="tech-row"><span class="tech-label">Tech</span><span class="tech">' + escapeHtml(technology) + '</span></div>'
          : '') +
        (description ? '<div class="desc">' + escapeHtml(description) + '</div>' : '');
      return detail;
    }

    const LOCATE_ICON_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="12" r="3"></circle>' +
      '<path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>' +
      '</svg>';

    boxesEl.addEventListener('click', (event) => {
      const btn = event.target.closest('.icon-btn');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      if (id) {
        parent.postMessage({ pluginMessage: { type: 'focus', id } }, '*');
      }
    });

    function renderRelations() {
      const filtered = currentRelations.filter(relationMatchesSearch);
      relationCountEl.textContent =
        filtered.length === currentRelations.length
          ? currentRelations.length
          : filtered.length + ' / ' + currentRelations.length;
      relationsEl.innerHTML = '';
      if (currentRelations.length === 0) {
        relationsEl.innerHTML = '<div class="empty">No connectors found between shapes on this page.</div>';
        hideRelationDetail();
        return;
      }
      if (filtered.length === 0) {
        relationsEl.innerHTML = '<div class="empty">Ninguna relación coincide con la búsqueda.</div>';
        hideRelationDetail();
        return;
      }
      filtered.forEach((r) => {
        const row = document.createElement('div');
        row.className = 'relation' + (r.id === selectedRelationId ? ' selected' : '');
        row.setAttribute('data-relation-id', r.id);
        row.innerHTML =
          '<button class="icon-btn" data-id="' + escapeHtml(r.id) + '" title="Ir al conector en el lienzo">' +
            LOCATE_ICON_SVG +
          '</button>' +
          '<span class="name">' + escapeHtml(r.sourceName) + '</span>' +
          typeBadgeHtml(findBox(r.source) && findBox(r.source).elementType) +
          '<span class="label">&rarr; ' + (r.label ? escapeHtml(r.label) : '') + ' &rarr;</span>' +
          '<span class="name">' + escapeHtml(r.targetName) + '</span>' +
          typeBadgeHtml(findBox(r.target) && findBox(r.target).elementType);
        relationsEl.appendChild(row);
      });

      if (selectedRelationId && filtered.some((r) => r.id === selectedRelationId)) {
        renderRelationDetail(selectedRelationId);
      } else {
        hideRelationDetail();
      }
    }

    function findBox(id) {
      return currentBoxes.find((b) => b.id === id) || null;
    }

    function renderEndpointCard(role, nodeId, fallbackName) {
      const box = findBox(nodeId);
      const name = box ? box.name : fallbackName;
      const isFallback = box && box.labelSource === 'node-name-fallback';
      const card = document.createElement('div');
      card.className = 'endpoint-card';

      const nameRow = document.createElement('div');
      nameRow.className = 'endpoint-name-row';
      nameRow.innerHTML =
        '<button class="icon-btn" data-id="' + escapeHtml(nodeId) + '" title="Ir al elemento en el lienzo">' +
          LOCATE_ICON_SVG +
        '</button>' +
        '<span class="name">' + escapeHtml(name) + '</span>' +
        (box ? typeBadgeHtml(box.elementType) : '') +
        (box ? '<span class="badge">' + escapeHtml(box.nodeType) + '</span>' : '') +
        (box ? '<span class="badge' + (isFallback ? ' fallback' : '') + '">' + escapeHtml(box.labelSource) + '</span>' : '');

      const roleEl = document.createElement('div');
      roleEl.className = 'endpoint-role';
      roleEl.textContent = role;

      const body = document.createElement('div');
      body.className = 'endpoint-body';
      body.appendChild(nameRow);
      if (box && (box.technology || box.description)) {
        body.appendChild(renderBoxDetail(box.technology, box.description));
      }

      card.appendChild(roleEl);
      card.appendChild(body);
      return card;
    }

    function renderRelationDetail(relationId) {
      const relation = currentRelations.find((r) => r.id === relationId);
      if (!relation) {
        hideRelationDetail();
        return;
      }
      relationDetailEl.innerHTML = '';

      const header = document.createElement('div');
      header.className = 'relation-detail-header';
      header.innerHTML =
        '<span class="label-text">' + (relation.label ? escapeHtml(relation.label) : '(sin etiqueta)') + '</span>' +
        '<button class="relation-detail-close" title="Cerrar">&times;</button>';
      relationDetailEl.appendChild(header);
      header.querySelector('.relation-detail-close').onclick = () => {
        selectedRelationId = null;
        hideRelationDetail();
        relationsEl.querySelectorAll('.relation.selected').forEach((el) => el.classList.remove('selected'));
      };

      relationDetailEl.appendChild(renderEndpointCard('Start', relation.source, relation.sourceName));
      relationDetailEl.appendChild(renderEndpointCard('End', relation.target, relation.targetName));

      const row = relationsEl.querySelector('.relation[data-relation-id="' + relationId + '"]');
      if (row) {
        row.insertAdjacentElement('afterend', relationDetailEl);
      }

      relationDetailEl.classList.remove('hidden');
    }

    function hideRelationDetail() {
      relationDetailEl.classList.add('hidden');
      relationDetailEl.innerHTML = '';
    }

    relationsEl.addEventListener('click', (event) => {
      const focusBtn = event.target.closest('.icon-btn');
      if (focusBtn) {
        const id = focusBtn.getAttribute('data-id');
        if (id) {
          parent.postMessage({ pluginMessage: { type: 'focus', id } }, '*');
        }
      }
      const row = event.target.closest('.relation');
      if (!row) return;
      const relationId = row.getAttribute('data-relation-id');
      selectedRelationId = focusBtn ? relationId : (selectedRelationId === relationId ? null : relationId);
      relationsEl.querySelectorAll('.relation').forEach((el) => {
        el.classList.toggle('selected', el.getAttribute('data-relation-id') === selectedRelationId);
      });
      if (selectedRelationId) {
        renderRelationDetail(selectedRelationId);
      } else {
        hideRelationDetail();
      }
    });

    relationDetailEl.addEventListener('click', (event) => {
      const btn = event.target.closest('.icon-btn');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      if (id) {
        parent.postMessage({ pluginMessage: { type: 'focus', id } }, '*');
      }
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function slugify(name, used) {
      let base = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
      if (!base) base = 'node';
      if (/^[0-9]/.test(base)) base = 'n_' + base;
      let id = base;
      let i = 1;
      while (used.has(id)) {
        id = base + '_' + (i++);
      }
      used.add(id);
      return id;
    }

    function esc(str) {
      return String(str || '').replace(/"/g, '\\"');
    }

    function toMermaidC4(boxes, relations) {
      const used = new Set();
      const idMap = new Map();
      boxes.forEach((b) => idMap.set(b.id, slugify(b.name, used)));

      const lines = ['C4Container', ''];
      boxes.forEach((b) => {
        const id = idMap.get(b.id);
        const args = ['"' + esc(b.name) + '"'];
        if (b.description) {
          args.push('"' + esc(b.technology) + '"', '"' + esc(b.description) + '"');
        } else if (b.technology) {
          args.push('"' + esc(b.technology) + '"');
        }
        lines.push('Container(' + id + ', ' + args.join(', ') + ')');
      });
      lines.push('');
      relations.forEach((r) => {
        const s = idMap.get(r.source);
        const t = idMap.get(r.target);
        if (!s || !t) return;
        const label = esc(r.label);
        lines.push('Rel(' + s + ', ' + t + ', "' + label + '")');
      });
      return lines.join('\n');
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'relations') {
        currentBoxes = msg.boxes || [];
        currentRelations = msg.relations || [];
        renderBoxes();
        renderRelations();
        if (!tabViews.export.classList.contains('hidden')) {
          mermaidOutput.value = toMermaidC4(currentBoxes, currentRelations);
        }
      }
    };
  </script>
</body>
</html>
