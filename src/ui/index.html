<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /*BUILD:INLINE_CSS*/
        </style>
    </head>
    <body>
        <div class="sticky-header">
            <div class="title-row">
                <div class="title-left">
                    <svg
                        class="app-icon"
                        viewBox="0 0 32 32"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <rect width="32" height="32" rx="7" fill="#18a0fb" />
                        <rect
                            x="4"
                            y="5"
                            width="9"
                            height="7"
                            rx="1.5"
                            fill="#fff"
                        />
                        <rect
                            x="19"
                            y="5"
                            width="9"
                            height="7"
                            rx="1.5"
                            fill="#fff"
                            fill-opacity="0.85"
                        />
                        <rect
                            x="11.5"
                            y="20"
                            width="9"
                            height="7"
                            rx="1.5"
                            fill="#fff"
                            fill-opacity="0.7"
                        />
                        <path
                            d="M8.5 12v3.5a2 2 0 0 0 2 2h5m0 0h5a2 2 0 0 0 2-2V12"
                            stroke="#fff"
                            stroke-width="1.4"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M16 17.5V20"
                            stroke="#fff"
                            stroke-width="1.4"
                            stroke-linecap="round"
                        />
                    </svg>
                    <h2>C4 Relations</h2>
                </div>
                <button id="refresh" title="Re-extract from canvas">
                    &#8635; Refresh
                </button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="relations">
                    Relations
                    <span class="tab-count" id="relation-count">0</span>
                </button>
                <button class="tab-btn" data-tab="boxes">
                    Boxes <span class="tab-count" id="box-count">0</span>
                </button>
                <button class="tab-btn" data-tab="export">Export</button>
            </div>

            <div class="search-bar" id="search-bar">
                <svg
                    class="search-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M21 21l-4.3-4.3"></path>
                </svg>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by name, description or technology..."
                />
                <button
                    class="search-clear"
                    id="search-clear"
                    title="Clear search"
                >
                    &times;
                </button>
            </div>
        </div>

        <div class="content">
            <div id="relations-view" class="tab-view">
                <div id="relations"></div>
                <div id="relation-detail" class="relation-detail hidden"></div>
            </div>

            <div id="boxes-view" class="tab-view hidden">
                <div class="boxes" id="boxes"></div>
            </div>

            <div id="export-view" class="tab-view hidden">
                <div class="export-toolbar">
                    <div class="format-toggle">
                        <button
                            class="format-btn active"
                            id="format-mermaid"
                            data-format="mermaid"
                            title="Text diagram syntax you can paste into any Mermaid-compatible tool (e.g. mermaid.live or Markdown docs) to render the C4 diagram."
                        >
                            Mermaid C4
                        </button>
                        <button
                            class="format-btn"
                            id="format-likec4"
                            data-format="likec4"
                            title="Text format for the LikeC4 tool, for teams that keep their C4 model as versioned code."
                        >
                            LikeC4 DSL
                        </button>
                    </div>
                    <button id="copy" class="primary">Copy to clipboard</button>
                </div>
                <textarea id="mermaid-output" readonly></textarea>
                <div id="copy-status" class="status"></div>
            </div>
        </div>

        <script>
            /*BUILD:INLINE_JS*/
        </script>
    </body>
</html>
